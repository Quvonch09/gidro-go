name: CI/CD Pipeline - GidroGo Backend

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Build JAR with Maven
        run: ./mvnw clean package -DskipTests

      - name: Prepare Remote Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || '169.58.215.170' }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD || 'quvonch09' }}
          port: 22
          script: |
            mkdir -p /root/gidrogo/tmp

      - name: Copy JAR to Remote Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST || '169.58.215.170' }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD || 'quvonch09' }}
          port: 22
          source: "target/gidrogo-backend-2.0.0.jar"
          target: "/root/gidrogo/tmp"
          strip_components: 1

      - name: Update JAR and Restart Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || '169.58.215.170' }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD || 'quvonch09' }}
          port: 22
          script: |
            mkdir -p /opt/gidrogo/uploads
            mv -f /root/gidrogo/tmp/gidrogo-backend-2.0.0.jar /opt/gidrogo/gidrogo-backend.jar
            cp -f /opt/gidrogo/gidrogo-backend.jar /root/gidrogo/gidrogo-backend.jar
            systemctl daemon-reload
            systemctl restart gidrogo.service
            echo "Service restarted. Waiting 20 seconds for Spring Boot..."
            sleep 20
            systemctl is-active --quiet gidrogo.service && echo "GidroGo backend is ACTIVE!" || (echo "Service failed to start" && journalctl -u gidrogo -n 30 --no-pager && exit 1)
