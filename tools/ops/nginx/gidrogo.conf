# GidroGo — nginx teskari proksi (nol byudjet: domensiz, Let's Encrypt IP sertifikati)
# O'rnatish: tools/ops/README.md. __SERVER_IP__ ni setup skripti almashtiradi.

# 80-port: faqat ACME tekshiruvi va https'ga yo'naltirish.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __SERVER_IP__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# WebSocket uchun Upgrade sarlavhasi.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # `listen ... http2` — Ubuntu 22.04/24.04 dagi nginx 1.18–1.24 bilan mos
    # (`http2 on;` faqat 1.25.1+ da bor).
    listen 443 ssl default_server http2;
    listen [::]:443 ssl default_server http2;
    server_name __SERVER_IP__;

    # IP sertifikati 6 kunlik (shortlived) — certbot deploy-hook nginx'ni qayta yuklaydi.
    ssl_certificate     /etc/letsencrypt/live/__SERVER_IP__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__SERVER_IP__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # Yetkazish fotosurati ilovada ≤5 MB (GG-02) — zaxira bilan.
    client_max_body_size 10m;

    # Huquqiy sahifalar (Play Market: Privacy policy va Account deletion URL).
    location /legal/ {
        alias /var/www/gidrogo-legal/;
        index maxfiylik-siyosati.html;
    }

    # WebSocket (/ws/courier, /ws/client). Token URL'da (GG-40) — log'ga yozilmaydi.
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        access_log off;
    }

    # REST API va /api/files/view.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
